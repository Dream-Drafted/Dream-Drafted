    .num-7 { animation-delay: 1.3s; }
    .num-8 { animation-delay: 1.45s; }
    .num-9 { animation-delay: 1.6s; }
    
    .label-1 { animation-delay: 0.5s; }
    .label-2 { animation-delay: 0.65s; }
    .label-3 { animation-delay: 0.8s; }
    .label-4 { animation-delay: 0.95s; }
