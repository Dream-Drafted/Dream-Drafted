<style>
    @keyframes panelSlideIn {
      from {
        opacity: 0;
        transform: scale(0.85);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    @keyframes textFade {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    
    @keyframes arrowDraw {
      from {
        opacity: 0;
        stroke-dashoffset: 100%;
      }
      to {
        opacity: 1;
        stroke-dashoffset: 0;
      }
    }
    
    .panel {
      animation: panelSlideIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      transform-origin: center;
    }
    
    .panel-num {
      animation: textFade 0.6s ease-out forwards;
      opacity: 0;
    }
    
    .panel-label {
      animation: textFade 0.6s ease-out forwards;
      opacity: 0;
    }
    
    .flow-arrow {
      animation: arrowDraw 0.6s ease-out forwards;
      opacity: 0;
      stroke-dasharray: 100%;
    }
    
    .panel-1 { animation-delay: 0.1s; }
    .panel-2 { animation-delay: 0.25s; }
    .panel-3 { animation-delay: 0.4s; }
    .panel-4 { animation-delay: 0.55s; }
    .panel-5 { animation-delay: 0.7s; }
    .panel-6 { animation-delay: 0.85s; }
    .panel-7 { animation-delay: 1.0s; }
    .panel-8 { animation-delay: 1.15s; }
    .panel-9 { animation-delay: 1.3s; }
    
    .num-1 { animation-delay: 0.4s; }
    .num-2 { animation-delay: 0.55s; }
    .num-3 { animation-delay: 0.7s; }
    .num-4 { animation-delay: 0.85s; }
