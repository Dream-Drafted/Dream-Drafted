<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Monaco, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#0a0d12"/></linearGradient>
<linearGradient id="gradCRITICAL" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ff4757" stop-opacity="0.95"/><stop offset="100%" stop-color="#ff4757" stop-opacity="0.55"/></linearGradient>
<linearGradient id="gradHIGH" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ff9f43" stop-opacity="0.95"/><stop offset="100%" stop-color="#ff9f43" stop-opacity="0.55"/></linearGradient>
<linearGradient id="gradMEDIUM" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#feca57" stop-opacity="0.95"/><stop offset="100%" stop-color="#feca57" stop-opacity="0.55"/></linearGradient>
<linearGradient id="gradLOW" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#54e6a0" stop-opacity="0.95"/><stop offset="100%" stop-color="#54e6a0" stop-opacity="0.55"/></linearGradient>
<filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
    @keyframes barRiseIn {
      from {
        opacity: 0;
        transform: translateY(80px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes numberPop {
      0% {
        opacity: 0;
        transform: scale(0.3);
      }
      50% {
        transform: scale(1.15);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    @keyframes labelFade {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    
    @keyframes glow {
      0%, 100% {
        filter: url(#softGlow) drop-shadow(0 0 3px rgba(255, 71, 87, 0.3));
      }
      50% {
        filter: url(#softGlow) drop-shadow(0 0 8px rgba(255, 71, 87, 0.6));
      }
    }
    
    .bar-critical {
      animation: barRiseIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, glow 2.5s ease-in-out 1s infinite;
      animation-delay: 0s;
    }
    
    .bar-high {
      animation: barRiseIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, glow 2.5s ease-in-out 1.15s infinite;
      animation-delay: 0.2s;
    }
    
    .bar-medium {
      animation: barRiseIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, glow 2.5s ease-in-out 1.3s infinite;
      animation-delay: 0.4s;
    }
    
    .bar-low {
      animation: barRiseIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, glow 2.5s ease-in-out 1.45s infinite;
      animation-delay: 0.6s;
    }
    
    .bar-number {
      animation: numberPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
    }
    
    .bar-label {
      animation: labelFade 0.8s ease-out forwards;
      animation-delay: 1.2s;
      opacity: 0;
    }
  </style>
</defs>
<rect x="0" y="0" width="700" height="420" fill="url(#bg)" rx="12"/>
<text x="350.0" y="34" fill="#00d4ff" font-size="17" font-weight="bold" text-anchor="middle" letter-spacing="1">CVSS SEVERITY DISTRIBUTION</text>
<text x="350.0" y="54" fill="#6e7681" font-size="11" text-anchor="middle">Multi-Tenant SaaS Platform Audit &#183; 10 Verified Findings</text>
<line x1="70" y1="350" x2="660" y2="350" stroke="#21262d" stroke-width="1.5"/>
<line x1="70" y1="292.5" x2="660" y2="292.5" stroke="#161b22" stroke-width="1" stroke-dasharray="3,4"/>
<text x="55" y="296.5" fill="#484f58" font-size="10" text-anchor="end">1</text>
<line x1="70" y1="235.0" x2="660" y2="235.0" stroke="#161b22" stroke-width="1" stroke-dasharray="3,4"/>
<text x="55" y="239.0" fill="#484f58" font-size="10" text-anchor="end">2</text>
<line x1="70" y1="177.5" x2="660" y2="177.5" stroke="#161b22" stroke-width="1" stroke-dasharray="3,4"/>
<text x="55" y="181.5" fill="#484f58" font-size="10" text-anchor="end">3</text>
<line x1="70" y1="120.0" x2="660" y2="120.0" stroke="#161b22" stroke-width="1" stroke-dasharray="3,4"/>
<text x="55" y="124.0" fill="#484f58" font-size="10" text-anchor="end">4</text>
<path class="bar-critical" d="M130,350 L130,235.0 L200,235.0 L200,350 Z" fill="url(#gradCRITICAL)" filter="url(#softGlow)"/>
<path d="M200,235.0 L216,225.0 L216,340 L200,350 Z" fill="#ff4757" fill-opacity="0.35"/>
<path d="M130,235.0 L146,225.0 L216,225.0 L200,235.0 Z" fill="#ff4757" fill-opacity="0.75"/>
<text class="bar-number" x="165.0" y="221.0" fill="#ff4757" font-size="20" font-weight="bold" text-anchor="middle">2</text>
<text class="bar-label" style="animation-delay: 1.2s" x="165.0" y="372" fill="#c9d1d9" font-size="11" font-weight="bold" text-anchor="middle">CRITICAL</text>
<path class="bar-high" d="M255,350 L255,177.5 L325,177.5 L325,350 Z" fill="url(#gradHIGH)" filter="url(#softGlow)"/>
<path d="M325,177.5 L341,167.5 L341,340 L325,350 Z" fill="#ff9f43" fill-opacity="0.35"/>
<path d="M255,177.5 L271,167.5 L341,167.5 L325,177.5 Z" fill="#ff9f43" fill-opacity="0.75"/>
<text class="bar-number" x="290.0" y="163.5" fill="#ff9f43" font-size="20" font-weight="bold" text-anchor="middle">3</text>
<text class="bar-label" style="animation-delay: 1.4s" x="290.0" y="372" fill="#c9d1d9" font-size="11" font-weight="bold" text-anchor="middle">HIGH</text>
<path class="bar-medium" d="M380,350 L380,120.0 L450,120.0 L450,350 Z" fill="url(#gradMEDIUM)" filter="url(#softGlow)"/>
<path d="M450,120.0 L466,110.0 L466,340 L450,350 Z" fill="#feca57" fill-opacity="0.35"/>
<path d="M380,120.0 L396,110.0 L466,110.0 L450,120.0 Z" fill="#feca57" fill-opacity="0.75"/>
<text class="bar-number" x="415.0" y="106.0" fill="#feca57" font-size="20" font-weight="bold" text-anchor="middle">4</text>
<text class="bar-label" style="animation-delay: 1.6s" x="415.0" y="372" fill="#c9d1d9" font-size="11" font-weight="bold" text-anchor="middle">MEDIUM</text>
<path class="bar-low" d="M505,350 L505,292.5 L575,292.5 L575,350 Z" fill="url(#gradLOW)" filter="url(#softGlow)"/>
<path d="M575,292.5 L591,282.5 L591,340 L575,350 Z" fill="#54e6a0" fill-opacity="0.35"/>
<path d="M505,292.5 L521,282.5 L591,282.5 L575,292.5 Z" fill="#54e6a0" fill-opacity="0.75"/>
<text class="bar-number" x="540.0" y="278.5" fill="#54e6a0" font-size="20" font-weight="bold" text-anchor="middle">1</text>
<text class="bar-label" style="animation-delay: 1.8s" x="540.0" y="372" fill="#c9d1d9" font-size="11" font-weight="bold" text-anchor="middle">LOW</text>
<text x="70" y="400" fill="#484f58" font-size="9.5">Source: 10 documented CVSS v3.1 findings, Multi-Tenant SaaS Platform Audit (Mar 25 &#8211; Apr 4, 2026)</text>
<text x="70" y="418" fill="#3d444d" font-size="9">Critical &#8805;9.0 &#183; High 7.0&#8211;8.9 &#183; Medium 4.0&#8211;6.9 &#183; Low &lt;4.0 (CVSS v3.1)</text>
</svg>