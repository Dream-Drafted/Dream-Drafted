<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Monaco, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    @keyframes dotAppear {
      0% {
        opacity: 0;
        r: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        r: 6;
      }
    }
    
    @keyframes dotPulse {
      0%, 100% {
        filter: drop-shadow(0 0 2px currentColor);
      }
      50% {
        filter: drop-shadow(0 0 8px currentColor);
      }
    }
    
    @keyframes textFadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    
    .dot-critical {
      animation: dotAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, dotPulse 2s ease-in-out infinite;
      animation-delay: 0s;
    }
    
    .dot-high {
      animation: dotAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, dotPulse 2s ease-in-out infinite;
      animation-delay: 0.15s;
    }
    
    .dot-medium {
      animation: dotAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, dotPulse 2s ease-in-out infinite;
      animation-delay: 0.3s;
    }
    
    .dot-low {
      animation: dotAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, dotPulse 2s ease-in-out infinite;
      animation-delay: 0.45s;
    }
    
    .score-label {
      animation: textFadeIn 0.8s ease-out forwards;
      animation-delay: 0.7s;
      opacity: 0;
    }
    
    .finding-label {
      animation: textFadeIn 0.8s ease-out forwards;
      animation-delay: 0.7s;
      opacity: 0;
    }
  </style></defs>
