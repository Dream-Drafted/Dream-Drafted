<svg viewBox="0 0 760 454" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Monaco, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00ff88"/>
    <stop offset="100%" stop-color="#00d4ff"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <style>
    @keyframes barGrow {
      from {
        width: 0;
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    
    @keyframes textFade {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    
    @keyframes pulse {
      0%, 100% {
        filter: drop-shadow(0 0 3px rgba(0, 255, 136, 0.3));
      }
      50% {
        filter: drop-shadow(0 0 8px rgba(0, 212, 255, 0.6));
      }
    }
    
    .animated-bar {
      animation: barGrow 0.8s ease-out forwards;
    }
    
    .animated-text {
      animation: textFade 0.6s ease-out forwards;
      opacity: 0;
    }
    
    .title-text {
      animation: pulse 3s ease-in-out infinite;
    }
    
    .bar-1 { animation-delay: 0.1s; }
    .bar-2 { animation-delay: 0.2s; }
    .bar-3 { animation-delay: 0.3s; }
    .bar-4 { animation-delay: 0.4s; }
    .bar-5 { animation-delay: 0.5s; }
    .bar-6 { animation-delay: 0.6s; }
    .bar-7 { animation-delay: 0.7s; }
    .bar-8 { animation-delay: 0.8s; }
    .bar-9 { animation-delay: 0.9s; }
    .bar-10 { animation-delay: 1.0s; }
    
    .text-1 { animation-delay: 0.6s; }
    .text-2 { animation-delay: 0.7s; }
    .text-3 { animation-delay: 0.8s; }
    .text-4 { animation-delay: 0.9s; }
    .text-5 { animation-delay: 1.0s; }
    .text-6 { animation-delay: 1.1s; }
    .text-7 { animation-delay: 1.2s; }
    .text-8 { animation-delay: 1.3s; }
    .text-9 { animation-delay: 1.4s; }
    .text-10 { animation-delay: 1.5s; }
  </style>
</defs>
