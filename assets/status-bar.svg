<svg viewBox="0 0 900 100" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Monaco, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="sbBg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0d1117"/><stop offset="50%" stop-color="#11161d"/><stop offset="100%" stop-color="#0d1117"/></linearGradient>
<style>
    @keyframes statNumberPop {
      0% {
        opacity: 0;
        transform: scale(0.4) translateY(10px);
      }
      60% {
        transform: scale(1.1);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    
    @keyframes statLabelFade {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    
    @keyframes linePulse {
      0%, 100% {
        opacity: 0.3;
      }
      50% {
        opacity: 0.8;
      }
    }
    
    .stat-number {
      animation: statNumberPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      transform-origin: center;
      opacity: 0;
    }
    
    .stat-label {
      animation: statLabelFade 0.8s ease-out forwards;
      opacity: 0;
    }
    
    .stat-divider {
      animation: linePulse 2s ease-in-out infinite;
    }
    
    .stat-1 { animation-delay: 0.2s; }
    .stat-2 { animation-delay: 0.4s; }
    .stat-3 { animation-delay: 0.6s; }
    .stat-4 { animation-delay: 0.8s; }
    .stat-5 { animation-delay: 1.0s; }
    
    .label-1 { animation-delay: 0.5s; }
    .label-2 { animation-delay: 0.7s; }
    .label-3 { animation-delay: 0.9s; }
    .label-4 { animation-delay: 1.1s; }
    .label-5 { animation-delay: 1.3s; }
    
    .div-1 { animation-delay: 0.3s; }
    .div-2 { animation-delay: 0.5s; }
    .div-3 { animation-delay: 0.7s; }
    .div-4 { animation-delay: 0.9s; }
  </style>
</defs>
<rect x="0" y="0" width="900" height="100" rx="10" fill="url(#sbBg)" stroke="#21262d" stroke-width="1"/>
<text class="stat-number stat-1" x="90.0" y="46" fill="#00d4ff" font-size="24" font-weight="bold" text-anchor="middle">8+ YRS</text>
<text class="stat-label label-1" x="90.0" y="68" fill="#8b949e" font-size="9.5" text-anchor="middle" letter-spacing="0.5">SELF-TAUGHT</text>
<line class="stat-divider div-1" x1="180.0" y1="20" x2="180.0" y2="80" stroke="#21262d" stroke-width="1"/>
<text class="stat-number stat-2" x="270.0" y="46" fill="#00d4ff" font-size="24" font-weight="bold" text-anchor="middle">10</text>
<text class="stat-label label-2" x="270.0" y="68" fill="#8b949e" font-size="9.5" text-anchor="middle" letter-spacing="0.5">VERIFIED FINDINGS</text>
<line class="stat-divider div-2" x1="360.0" y1="20" x2="360.0" y2="80" stroke="#21262d" stroke-width="1"/>
<text class="stat-number stat-3" x="450.0" y="46" fill="#00d4ff" font-size="24" font-weight="bold" text-anchor="middle">2</text>
<text class="stat-label label-3" x="450.0" y="68" fill="#8b949e" font-size="9.5" text-anchor="middle" letter-spacing="0.5">CASE STUDIES</text>
<line class="stat-divider div-3" x1="540.0" y1="20" x2="540.0" y2="80" stroke="#21262d" stroke-width="1"/>
<text class="stat-number stat-4" x="630.0" y="46" fill="#00d4ff" font-size="24" font-weight="bold" text-anchor="middle">10</text>
<text class="stat-label label-4" x="630.0" y="68" fill="#8b949e" font-size="9.5" text-anchor="middle" letter-spacing="0.5">MAX FIXED-CVSS</text>
<line class="stat-divider div-4" x1="720.0" y1="20" x2="720.0" y2="80" stroke="#21262d" stroke-width="1"/>
<text class="stat-number stat-5" x="810.0" y="46" fill="#00d4ff" font-size="24" font-weight="bold" text-anchor="middle">27-PG</text>
<text class="stat-label label-5" x="810.0" y="68" fill="#8b949e" font-size="9.5" text-anchor="middle" letter-spacing="0.5">AUDIT REPORT</text>
</svg>
